<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - HMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Patient Portal</h1>
        <p>Access your appointments and medical records</p>
        
        <form onsubmit="event.preventDefault(); alert('Patient login simulated successfully!');">
            <div class="form-group">
                <input type="email" placeholder="Patient Email" required class="input-field">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required class="input-field">
            </div>
            <button type="submit" class="btn btn-patient" style="width: 100%;">Login</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</body>
</html>
