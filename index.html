<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.8);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-doctor {
            background-color: #2563eb;
            color: white;
        }
        .btn-doctor:hover {
            background-color: #1d4ed8;
        }
        .btn-patient {
            background-color: #059669;
            color: white;
        }
        .btn-patient:hover {
            background-color: #047857;
        }
        .btn-ai {
            background-color: #7c3aed;
            color: white;
        }
        .btn-ai:hover {
            background-color: #6d28d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hospital Management System</h1>
        <p>Select your portal to continue</p>
        
        <div class="btn-group">
            <a href="doctor-login.html" class="btn btn-doctor">Doctor Portal</a>
            <a href="patient-login.html" class="btn btn-patient">Patient Portal</a>
            <a href="ai.html" class="btn btn-ai">AI Assistant Hub</a>
        </div>
    </div>
</body>
</html>
