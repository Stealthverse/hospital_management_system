<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - HMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Doctor Portal</h1>
        <p>Enter your credentials to access your dashboard</p>
        
        <form onsubmit="event.preventDefault(); alert('Doctor login simulated successfully!');">
            <div class="form-group">
                <input type="email" placeholder="Doctor Email" required class="input-field">
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required class="input-field">
            </div>
            <button type="submit" class="btn btn-doctor" style="width: 100%;">Login</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</body>
</html>
